
<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ASSIEME - AR Viewer</title>

<script type="module"
src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
}

model-viewer {
    width: 100%;
    height: 68vh;
    min-height: 350px;
    background: #000;
}

model-viewer::part(default-ar-button) {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 22px;
}

#status {
    padding: 10px;
    color: #00ff88;
    font-size: 14px;
    text-align: center;
}

button, select {
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin: 4px;
}

#animBtn {
    background: #444;
    color: white;
}

#testBtn {
    background: #1769aa;
    color: white;
}

#backBtn {
    background: #555;
    color: white;
}

.controls-section {
    width: 95%;
    margin: 10px 0;
}

.controls-section h3 {
    font-size: 17px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.green { background: green; color: white; }
.blue { background: blue; color: white; }
.orange { background: orange; color: white; }
.yellow { background: yellow; color: black; }
.lightgray { background: lightgray; color: black; }
.darkgray { background: dimgray; color: white; }
.red { background: red; color: white; }

</style>
</head>

<body>

<!-- MODELLO -->

<model-viewer
id="viewer"
src="./linea%20lunga_V4.glb"
ar
ar-modes="scene-viewer webxr"
camera-controls
auto-rotate
shadow-intensity="0"
exposure="0.6"
loading="eager"
reveal="auto"
alt="ASSIEME 3D Model">

</model-viewer>

<div id="status">
Caricamento modello...
</div>

<!-- TEST SCENE VIEWER -->

<button id="testBtn">
Prova AR con modello Google
</button>

<button id="backBtn">
Torna al mio modello
</button>

<!-- ANIMAZIONI -->

<select id="animSelect" disabled>
<option value="">Seleziona animazione</option>
</select>

<button id="animBtn" disabled>
▶ Play animation
</button>

<!-- STRUCTURE COLOR -->

<div class="controls-section">

<h3>Structure Color</h3>

<div class="controls">

<button class="green" data-material="0" data-color="0,0.1,0,1">Verde</button>

<button class="blue" data-material="0" data-color="0,0,0.18,1">Blu</button>

<button class="orange" data-material="0" data-color="1,0.12,0,1">Arancio</button>

<button class="lightgray" data-material="0" data-color="0.55,0.55,0.55,1">Grigio chiaro</button>

<button class="darkgray" data-material="0" data-color="0.25,0.25,0.25,1">Grigio scuro</button>

<button class="red" data-material="0" data-color="0.22,0,0,1">Rosso</button>

</div>
</div>

<!-- MOBILE PARTS COLOR -->

<div class="controls-section">

<h3>Mobile Parts Color</h3>

<div class="controls">

<button class="green" data-material="2" data-color="0,0.1,0,1">Verde</button>

<button class="blue" data-material="2" data-color="0,0,1,1">Blu</button>

<button class="yellow" data-material="2" data-color="1,1,0,1">Giallo</button>

<button class="lightgray" data-material="2" data-color="0.55,0.55,0.55,1">Grigio chiaro</button>

<button class="darkgray" data-material="2" data-color="0.33,0.33,0.33,1">Grigio scuro</button>

<button class="red" data-material="2" data-color="1,0,0,1">Rosso</button>

</div>
</div>

<script type="module">

const viewer = document.querySelector("#viewer");
const status = document.querySelector("#status");
const animBtn = document.querySelector("#animBtn");
const animSelect = document.querySelector("#animSelect");

const MY_MODEL = "./linea%20lunga_V4.glb";

const GOOGLE_MODEL =
"https://storage.googleapis.com/ar-answers-in-search-models/static/Tiger/model.glb";

let currentModel = "mine";
let modelLoaded = false;
let animations = [];


/* CARICAMENTO MODELLO */

viewer.addEventListener("load", () => {

    modelLoaded = true;

    animations = viewer.availableAnimations || [];

    animSelect.innerHTML =
        '<option value="">Seleziona animazione</option>';

    animations.forEach(name => {

        const option = document.createElement("option");

        option.value = name;
        option.textContent = name;

        animSelect.appendChild(option);

    });

    animSelect.disabled = animations.length === 0;
    animBtn.disabled = animations.length === 0;

    if (animations.length > 0) {
        viewer.animationName = animations[0];
        animSelect.value = animations[0];
    }

    status.textContent =
        "Modello caricato correttamente. AR: " +
        (viewer.canActivateAR ? "disponibile" : "non disponibile");

    console.log("Modello caricato", viewer.model);
    console.log("Animazioni", animations);

});


/* ERRORI */

viewer.addEventListener("error", event => {

    modelLoaded = false;

    status.textContent =
        "Errore caricamento modello. Controllare file GLB e URL.";

    console.error("Errore modello:", event);

});


/* AVANZAMENTO */

viewer.addEventListener("progress", event => {

    if (!modelLoaded) {

        const percent = Math.round(
            event.detail.totalProgress * 100
        );

        status.textContent =
            "Caricamento: " + percent + "%";

    }

});


/* STATO AR */

viewer.addEventListener("ar-status", event => {

    console.log("AR:", event.detail.status);

    if (event.detail.status === "session-started") {
        status.textContent = "Realtà aumentata avviata";
    }

    if (event.detail.status === "object-placed") {
        status.textContent = "Modello posizionato";
    }

    if (event.detail.status === "failed") {
        status.textContent = "Avvio AR non riuscito";
    }

});


/* PLAY PAUSE */

function toggleAnimation() {

    if (!modelLoaded || animations.length === 0) return;

    if (viewer.paused) {

        viewer.play();
        animBtn.textContent = "⏸ Pause animation";

    } else {

        viewer.pause();
        animBtn.textContent = "▶ Play animation";

    }

}

animBtn.addEventListener("click", toggleAnimation);


/* CAMBIO ANIMAZIONE */

animSelect.addEventListener("change", () => {

    if (!animSelect.value) return;

    viewer.pause();

    viewer.animationName = animSelect.value;

    viewer.play();

    animBtn.textContent = "⏸ Pause animation";

});


/* CAMBIO COLORE */

function changeColor(index, rgba) {

    if (!viewer.model) return;

    const material = viewer.model.materials[index];

    if (material && material.pbrMetallicRoughness) {

        material.pbrMetallicRoughness.setBaseColorFactor(rgba);

    } else {

        console.warn("Materiale non trovato:", index);

    }

}


/* PULSANTI COLORI */

document.querySelectorAll("[data-material]").forEach(button => {

    button.addEventListener("click", () => {

        const index = Number(button.dataset.material);

        const rgba = button.dataset.color.split(",").map(Number);

        changeColor(index, rgba);

    });

});


/* CAMBIO MODELLO */

function loadModel(url, type) {

    modelLoaded = false;

    currentModel = type;

    viewer.pause();

    viewer.removeAttribute("ios-src");

    viewer.src = url;

    animSelect.disabled = true;
    animBtn.disabled = true;

    status.textContent = "Caricamento nuovo modello...";

}


viewer.addEventListener("load", () => {

    if (currentModel === "google") {

        status.textContent =
            "Modello Google caricato. Prova ora il pulsante AR.";

    }

});


/* TEST GOOGLE */

document.querySelector("#testBtn").addEventListener("click", () => {

    loadModel(GOOGLE_MODEL, "google");

});


/* RITORNO AL MODELLO ORIGINALE */

document.querySelector("#backBtn").addEventListener("click", () => {

    loadModel(MY_MODEL, "mine");

});

</script>

</body>
</html>
